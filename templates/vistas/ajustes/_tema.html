                <div class="accordion-item">
                    <h2 class="accordion-header">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#acc-tema">
                            <i class="fas fa-palette me-2" style="color: var(--primary-dark)"></i> Configuraciones de Tema
                        </button>
                    </h2>
                    <div id="acc-tema" class="accordion-collapse collapse" data-bs-parent="#ajustes-accordion">
                        <div class="accordion-body">
                            <label class="form-label small fw-bold">Tamaño de interfaz</label>
                            <div class="d-flex align-items-center gap-2 mb-3">
                                <button type="button" class="btn btn-sm btn-light" onclick="cambiarEscalaAccesibilidad(-1)" title="Disminuir tamaño de texto"><i class="fas fa-minus"></i> A</button>
                                <button type="button" class="btn btn-sm btn-light" onclick="cambiarEscalaAccesibilidad(1)" title="Aumentar tamaño de texto"><i class="fas fa-plus"></i> A</button>
                                <span id="tamanio-interfaz-valor" class="text-muted small">16px</span>
                            </div>

                            <label class="form-label small fw-bold">Color del tema</label>
                            <div class="d-flex flex-wrap gap-3 mb-3" id="contenedor-colores-tema">
                                <!-- Opciones de color se inyectan por JS -->
                            </div>

                            <div class="mb-3">
                                <label for="tema-titulo-app" class="form-label small fw-bold">Título de la barra superior</label>
                                <input type="text" class="form-control form-control-sm" id="tema-titulo-app" oninput="actualizarTituloAppEnVivo(this.value)" onchange="guardarTituloApp()" placeholder="Caminatas de la Tribu de Los Libres">
                            </div>

                            <div class="mb-3">
                                <label for="tema-titulo-directorio" class="form-label small fw-bold">Título del Directorio Global</label>
                                <input type="text" class="form-control form-control-sm" id="tema-titulo-directorio" oninput="actualizarTituloDirectorioEnVivo(this.value)" onchange="guardarTituloDirectorio()" placeholder="Directorio Global">
                            </div>

                            <hr>

                            <label class="form-label small fw-bold">Grupos / Tipos de contacto</label>
                            <p class="text-muted small mb-2">Base: Persona, Restaurante, Transporte Terrestre, Lancha, Hotel, Cabina, Guía, Finca, Parque Nacional. Podés agregar más abajo.</p>
                            <div class="input-group input-group-sm mb-2">
                                <input type="text" class="form-control" id="tema-nuevo-grupo" placeholder="Nombre del nuevo grupo">
                                <button class="btn btn-outline-success" type="button" onclick="agregarGrupoPersonalizado()" title="Agregar"><i class="fas fa-plus"></i></button>
                            </div>
                            <div id="tema-lista-grupos" class="d-flex flex-wrap gap-2">
                                <!-- Grupos personalizados se inyectan por JS -->
                            </div>
                        </div>
                    </div>
                </div>
