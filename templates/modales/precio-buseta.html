    <div class="modal fade" id="modalPrecioBuseta" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content p-3">
                <div class="modal-header border-0 pb-2">
                    <h6 class="modal-title" id="precio-buseta-label">Agregar Precio</h6>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body pt-0">
                    <input type="hidden" id="precio-buseta-id">
                    <div class="mb-3">
                        <label class="form-label small text-muted">Tipo</label>
                        <select class="form-select" id="precio-buseta-tipo" onchange="actualizarProvinciasPrecioBuseta()">
                            <option value="Local">Local</option>
                            <option value="Internacional">Internacional</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small text-muted">Provincia / País</label>
                        <select class="form-select" id="precio-buseta-provincia">
                            <option value="San José">San José</option>
                            <option value="Cartago">Cartago</option>
                            <option value="Alajuela">Alajuela</option>
                            <option value="Heredia">Heredia</option>
                            <option value="Guanacaste">Guanacaste</option>
                            <option value="Puntarenas">Puntarenas</option>
                            <option value="Limón">Limón</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small text-muted">Nombre del lugar</label>
                        <input type="text" class="form-control" id="precio-buseta-nombre" placeholder="Ej: Rincón de la Vieja">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small text-muted">Precio por buseta Transavi</label>
                        <input type="number" class="form-control" id="precio-buseta-monto" inputmode="numeric" placeholder="Ej: 150000">
                    </div>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-success btn-sm" style="background-color: var(--primary-dark);" onclick="guardarPrecioBuseta()">Guardar</button>
                </div>
            </div>
        </div>
    </div>
